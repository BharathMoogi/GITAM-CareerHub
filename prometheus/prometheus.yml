# Prometheus Configuration for GITAM CareerHub
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "careerhub-production"
    environment: "production"

# Alerting rules (connect to Alertmanager in production)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  # Scrape the FastAPI /metrics endpoint
  - job_name: "careerhub-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # PostgreSQL exporter (if postgres_exporter sidecar is added)
  # - job_name: "postgres"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # Redis exporter (if redis_exporter sidecar is added)
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
