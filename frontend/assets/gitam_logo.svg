<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Official GITAM Emblem -->
  <g transform="translate(10, 5)">
    <!-- Circle Base -->
    <circle cx="35" cy="35" r="34" fill="#005C45"/>
    
    <!-- Feather / Arc Radiating Wings Motif -->
    <g fill="#FFFFFF">
      <!-- Radiating Fan Feathers (Sun / Globe Wings) -->
      <path d="M 35 12 C 40 12, 45 15, 48 19 C 43 20, 39 21, 35 24 Z"/>
      <path d="M 45 16 C 50 20, 54 26, 56 31 C 51 30, 46 29, 41 30 Z"/>
      <path d="M 52 23 C 57 29, 59 36, 59 42 C 54 39, 49 37, 44 36 Z"/>
      <path d="M 55 33 C 58 40, 58 47, 56 53 C 52 48, 48 44, 43 42 Z"/>
      
      <!-- Central Flying Bird / Flame Body -->
      <path d="M 22 48 C 18 38, 24 24, 34 20 C 30 27, 28 35, 32 44 C 36 53, 48 54, 52 46 C 45 57, 30 60, 22 48 Z"/>
      <path d="M 28 32 C 32 26, 38 23, 44 24 C 38 28, 35 34, 36 40 C 33 37, 30 35, 28 32 Z"/>
    </g>
  </g>

  <!-- Official GITAM Typography -->
  <g transform="translate(90, 18)">
    <text x="0" y="32" font-family="'Inter', 'Arial', sans-serif" font-weight="900" font-size="34" fill="#005C45" letter-spacing="2">GITAM</text>
    <text x="2" y="48" font-family="'Inter', 'Arial', sans-serif" font-weight="700" font-size="7.5" fill="#005C45" letter-spacing="1.5">DEEMED TO BE UNIVERSITY</text>
  </g>
</svg>
