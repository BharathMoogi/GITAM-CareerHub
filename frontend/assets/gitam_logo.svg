<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="400" height="130">
  <style>
    .gitam-text { font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif; font-weight: 800; fill: #005C45; }
    .gitam-subtext { font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif; font-weight: 700; fill: #005C45; letter-spacing: 1.2px; }
  </style>

  <!-- Official GITAM Emblem (Emblem Circle + Soaring Bird + Pinwheel Fins) -->
  <g transform="translate(15, 10)">
    <!-- Outer Pinwheel Fins Ring -->
    <path fill="#005C45" d="
      M 55,5 
      C 60,5 65,8 68,12 C 60,15 54,20 50,26 C 58,22 66,20 74,22 C 78,23 81,25 83,28 C 74,28 66,31 60,36 C 68,34 76,34 83,37 C 87,39 89,42 90,46 C 81,43 73,43 66,46 C 74,47 81,50 86,55 C 89,58 90,62 89,66 C 80,60 72,58 64,59 C 71,63 77,68 81,75 C 83,79 83,83 81,87 C 73,79 66,75 58,74 C 64,80 68,87 70,95 C 70,99 69,103 66,106 C 60,97 54,91 46,88 C 50,96 52,104 52,112 C 50,115 47,117 43,117 C 40,107 35,99 28,94 C 30,103 30,111 28,119 C 25,121 21,121 18,119 C 20,109 19,100 14,92 C 14,101 12,109 8,116 C 5,117 2,116 0,113 C 4,104 6,94 4,84
    "/>

    <!-- Soaring Bird Negative Space Curve in Center -->
    <path fill="#005C45" d="
      M 48,22 
      A 38,38 0 1 0 86,60 
      A 38,38 0 0 0 48,22 Z
      M 32,84
      C 22,80 16,68 18,54
      C 20,40 30,30 42,28
      C 34,36 32,48 38,58
      C 44,68 56,72 68,68
      C 56,82 42,88 32,84 Z
    "/>

    <!-- Crisp White Bird Silhouette -->
    <path fill="#FFFFFF" d="
      M 32,84
      C 22,80 16,68 18,54
      C 20,40 30,30 42,28
      C 34,36 32,48 38,58
      C 44,68 56,72 68,68
      C 56,82 42,88 32,84 Z
    "/>
  </g>

  <!-- Typography matching exact GITAM logo branding -->
  <g transform="translate(155, 32)">
    <text x="0" y="42" class="gitam-text" font-size="52" letter-spacing="1">GITAM</text>
    <text x="2" y="64" class="gitam-subtext" font-size="11.5">DEEMED TO BE UNIVERSITY</text>
  </g>
</svg>
