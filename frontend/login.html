<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — GITAM CareerHub</title>
  <meta name="description" content="Official My-GITAM CareerHub Portal. Login for Students and Staff.">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="mygitam-container">

    <!-- ── LEFT PANEL: Deep GITAM Green (#005C45) ────────────────────────── -->
    <div class="mygitam-left">
      
      <!-- Brand Header -->
      <h1 class="mygitam-title">GITAM CareerHub</h1>

      <!-- Role Selector Cards -->
      <div class="role-cards-wrapper">
        
        <!-- Student Role Card -->
        <div class="role-card active" id="card-student">
          <h3 class="role-card-title">Student</h3>
          
          <!-- Line Art SVG Illustration: Engineering Students -->
          <svg class="role-svg-illustration" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Student 1 (Boy with Backpack) -->
            <path d="M55 75C61.6274 75 67 69.6274 67 63C67 56.3726 61.6274 51 55 51C48.3726 51 43 56.3726 43 63C43 69.6274 48.3726 75 55 75Z" stroke="#005C45" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M50 51C48 45 52 38 60 40C66 41 68 47 65 52" stroke="#005C45" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M38 100V165M72 100V165" stroke="#005C45" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M38 100C38 88 44 79 55 79C66 79 72 88 72 100" stroke="#005C45" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M30 115C26 125 28 140 32 145" stroke="#005C45" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M28 105C26 112 25 125 27 135" stroke="#005C45" stroke-width="2.5"/>

            <!-- Student 2 (Girl holding books) -->
            <path d="M125 75C131.627 75 137 69.6274 137 63C137 56.3726 131.627 51 125 51C118.373 51 113 56.3726 113 63C113 69.6274 118.373 75 125 75Z" stroke="#005C45" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M110 55C106 45 115 35 130 38C142 40 144 55 138 65" stroke="#005C45" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M110 100V165M140 100V165" stroke="#005C45" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M108 100C108 88 114 79 125 79C136 79 142 88 142 100" stroke="#005C45" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Books in arm -->
            <rect x="115" y="110" width="26" height="30" rx="3" stroke="#005C45" stroke-width="2.5" fill="none"/>
            <path d="M115 118H141" stroke="#005C45" stroke-width="2"/>
          </svg>
        </div>

        <!-- Staff Role Card -->
        <div class="role-card" id="card-staff">
          <h3 class="role-card-title">Staff</h3>
          
          <!-- Line Art SVG Illustration: Professional Staff / Faculty -->
          <svg class="role-svg-illustration" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Central Suit Person (Faculty Lead) -->
            <path d="M100 70C106.627 70 112 64.6274 112 58C112 51.3726 106.627 46 100 46C93.3726 46 88 51.3726 88 58C88 64.6274 93.3726 70 100 70Z" stroke="#005C45" stroke-width="2.5"/>
            <path d="M82 92C82 81 90 74 100 74C110 74 118 81 118 92V160H82V92Z" stroke="#005C45" stroke-width="2.5"/>
            <!-- Suit Lapel & Tie -->
            <path d="M93 74L100 95L107 74" stroke="#005C45" stroke-width="2"/>
            <path d="M100 95V125" stroke="#005C45" stroke-width="2.5"/>

            <!-- Left Female Staff -->
            <path d="M50 75C55.5228 75 60 70.5228 60 65C60 59.4772 55.5228 55 50 55C44.4772 55 40 59.4772 40 65C40 70.5228 44.4772 75 50 75Z" stroke="#005C45" stroke-width="2.5"/>
            <path d="M36 100C36 90 42 82 50 82C58 82 64 90 64 100V160H36V100Z" stroke="#005C45" stroke-width="2.5"/>
            <!-- Hair -->
            <path d="M38 60C36 50 45 42 55 45" stroke="#005C45" stroke-width="2.5"/>

            <!-- Right Staff Member -->
            <path d="M150 75C155.523 75 160 70.5228 160 65C160 59.4772 155.523 55 150 55C144.477 55 140 59.4772 140 65C140 70.5228 144.477 75 150 75Z" stroke="#005C45" stroke-width="2.5"/>
            <path d="M136 100C136 90 142 82 150 82C158 82 164 90 164 100V160H136V100Z" stroke="#005C45" stroke-width="2.5"/>
          </svg>
        </div>

      </div>

      <!-- Staircase Architectural Wave Graphic (Bottom Left) -->
      <svg class="staircase-lines" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="-20" cy="320" r="120" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
        <circle cx="-20" cy="320" r="140" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
        <circle cx="-20" cy="320" r="160" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
        <circle cx="-20" cy="320" r="180" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
        <circle cx="-20" cy="320" r="200" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
        <circle cx="-20" cy="320" r="220" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
        <circle cx="-20" cy="320" r="240" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
        <circle cx="-20" cy="320" r="260" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
        <circle cx="-20" cy="320" r="280" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
      </svg>
    </div>

    <!-- ── RIGHT PANEL: Clean White with Green Border Box ──────────────── -->
    <div class="mygitam-right">
      <div class="login-border-box">
        
        <!-- Official GITAM Logo Header -->
        <div class="gitam-header-logo" style="margin-bottom: 32px; text-align: center;">
          <img src="assets/gitam_logo_green.png" alt="GITAM Deemed to be University" style="height: 64px; width: auto; display: inline-block;">
        </div>






        <!-- Login Form -->
        <form class="mygitam-form" id="mygitam-form">
          <input 
            type="text" 
            id="username" 
            class="mygitam-input" 
            placeholder="Roll Number / Registration No." 
            value="2023003719"
            required
          >

          <input 
            type="password" 
            id="password" 
            class="mygitam-input" 
            placeholder="••••••••" 
            value="••••••••"
            required
          >

          <!-- reCAPTCHA Box -->
          <div class="recaptcha-card">
            <label class="recaptcha-left">
              <input type="checkbox" class="recaptcha-checkbox" id="recaptcha-check" checked>
              <span class="recaptcha-label-text">I'm not a robot</span>
            </label>

            <div class="recaptcha-right">
              <svg class="recaptcha-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 6C14.0589 6 6 14.0589 6 24C6 33.9411 14.0589 42 24 42C33.9411 42 42 33.9411 42 24" stroke="#4A90E2" stroke-width="4" stroke-linecap="round"/>
                <path d="M38 14L42 24L32 24" fill="#4A90E2"/>
              </svg>
              <span>reCAPTCHA</span>
              <span style="font-size: 0.5rem; color: #888;">Privacy - Terms</span>
            </div>
          </div>

          <!-- Submit LOGIN Button -->
          <button type="submit" class="btn-mygitam-submit" id="submit-btn">LOGIN</button>

          <!-- Footer Links -->
          <div class="mygitam-bottom-links">
            <a href="#" onclick="alert('Reset link sent to registered email.'); return false;">Reset password</a>
            <a href="#" onclick="alert('Contacting GITAM CATS Support...'); return false;">Contact CATS</a>
          </div>
        </form>

      </div>
    </div>

  </div>

  <script src="login.js"></script>
</body>
</html>
