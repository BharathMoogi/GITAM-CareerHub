# ─────────────────────────────────────────────────────────────────────────────
# GITAM CareerHub — Docker Compose Production Stack
#
# Services:
#   api        — FastAPI backend (4 uvicorn workers)
#   postgres   — PostgreSQL 16 with persistent volume & health check
#   redis      — Redis 7 for caching and Celery broker
#   celery     — Background task worker
#   celerybeat — Periodic task scheduler
#   nginx      — Reverse proxy with SSL termination
#   prometheus — Metrics scraping
#   grafana    — Metrics dashboard (optional, comment out to disable)
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

networks:
  careerhub_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: careerhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gitam_careerhub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db_backup.sh:/usr/local/bin/db_backup.sh:ro
    ports:
      - "5432:5432"
    networks:
      - careerhub_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gitam_careerhub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: careerhub_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - careerhub_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: careerhub_api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-gitam_careerhub}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-gitam-careerhub-change-in-production-min-32chars}
      FEATURE_RATE_LIMITING: "true"
      ENABLE_METRICS: "true"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - careerhub_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: careerhub_celery
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "app.core.celery_app", "worker",
              "--loglevel=info", "--concurrency=4", "--queues=default,emails,notifications"]
    environment:
      ENVIRONMENT: production
      POSTGRES_SERVER: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-gitam_careerhub}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - uploads_data:/app/uploads
    networks:
      - careerhub_network
    depends_on:
      - redis
      - postgres

  # ── Celery Beat Scheduler ─────────────────────────────────────────────────────
  celerybeat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: careerhub_celerybeat
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "app.core.celery_app", "beat",
              "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    networks:
      - careerhub_network
    depends_on:
      - redis

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: careerhub_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - uploads_data:/app/uploads:ro
    networks:
      - careerhub_network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: careerhub_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - careerhub_network
    depends_on:
      - api

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: careerhub_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - careerhub_network
    depends_on:
      - prometheus
